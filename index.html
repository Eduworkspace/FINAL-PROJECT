<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EduVoyage — Operations Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<!-- Supabase is OPTIONAL. If it fails to load, the app runs on this device's storage. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0F1B3D;
    --muted:#5A6B90;
    --faint:#8A98B8;
    --brand-top:#1B47B0;
    --brand-bot:#2E6BEB;
    --accent:#FF7A1A;
    --accent-press:#EA6A0C;
    --accent-soft:#FFEBD8;
    --bg:#F3F6FD;
    --surface:#FFFFFF;
    --line:#E4EAF6;
    --line-strong:#D3DCEF;
    --green:#137A46; --green-bg:#DFF6E9;
    --amber:#9A5B00; --amber-bg:#FCEFD3;
    --blue:#1B47B0;  --blue-bg:#DCE6FF;
    --red:#C2321F;   --red-bg:#FCE3DE;
    --purple:#6B34C9;--purple-bg:#EBE1FD;
    --grey:#5A6B90;  --grey-bg:#EAEEF7;
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(19,40,90,.06);
    --shadow-md:0 6px 22px rgba(19,40,90,.10);
    --shadow-lg:0 18px 50px rgba(19,40,90,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}

  /* ---------- LOGIN ---------- */
  #login{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 700px at 20% -10%, #2E6BEB 0%, #1B47B0 45%, #12307E 100%);
    padding:24px;
  }
  .login-card{
    width:100%; max-width:390px; background:var(--surface); border-radius:20px;
    padding:34px 30px; box-shadow:var(--shadow-lg);
  }
  .brandmark{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .logo-tile{
    width:46px;height:46px;border-radius:12px;flex:none;
    background:linear-gradient(150deg,var(--accent),#FF9E4D);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:17px;letter-spacing:.5px;
    box-shadow:0 6px 16px rgba(255,122,26,.35);
  }
  .brandmark h1{font-size:19px;margin:0;font-weight:800}
  .brandmark p{margin:0;font-size:12.5px;color:var(--muted);font-weight:600}
  .login-card label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}
  .login-card input{
    width:100%;padding:13px 14px;border:1.5px solid var(--line-strong);
    border-radius:11px;font-size:15px;background:#FBFCFF;
  }
  .login-card input:focus{outline:none;border-color:var(--brand-bot);box-shadow:0 0 0 3px var(--blue-bg)}
  .login-hint{font-size:12.5px;color:var(--muted);margin:14px 0 0;line-height:1.55}
  .err{color:var(--red);font-size:13px;font-weight:600;margin:12px 0 0;min-height:18px}

  .btn{
    border:none;border-radius:11px;font-weight:700;font-size:14.5px;
    padding:12px 18px;background:var(--accent);color:#fff;transition:background .15s, transform .05s;
    box-shadow:0 4px 12px rgba(255,122,26,.28);
  }
  .btn:hover{background:var(--accent-press)}
  .btn:active{transform:translateY(1px)}
  .btn.full{width:100%;margin-top:20px}
  .btn.ghost{background:transparent;color:var(--brand-top);box-shadow:none;border:1.5px solid var(--line-strong)}
  .btn.ghost:hover{background:var(--bg)}
  .btn.sm{padding:8px 13px;font-size:13px}
  .btn.danger{background:var(--red)}
  .btn.danger:hover{background:#a52717}

  /* ---------- SHELL ---------- */
  #app{display:none;min-height:100vh}
  .shell{display:flex;min-height:100vh}
  .sidebar{
    width:258px;flex:none;color:#EAF0FF;
    background:linear-gradient(200deg,var(--brand-top) 0%, #1E51CB 55%, #2E6BEB 100%);
    display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;
  }
  .side-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px}
  .side-brand .logo-tile{width:40px;height:40px;font-size:15px}
  .side-brand h1{font-size:16px;margin:0;color:#fff;font-weight:800}
  .side-brand p{margin:0;font-size:11.5px;color:#B9CCFF;font-weight:600}
  .nav-group{margin-top:14px}
  .nav-group .label{
    font-size:11px;letter-spacing:.7px;color:#9FB6F5;font-weight:700;
    padding:0 10px 8px;text-transform:uppercase;
  }
  .nav-item{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:transparent;border:none;color:#D6E1FF;font-weight:600;font-size:14.5px;
    padding:10px 11px;border-radius:10px;transition:background .12s,color .12s;
  }
  .nav-item:hover{background:rgba(255,255,255,.10);color:#fff}
  .nav-item.active{background:var(--accent);color:#fff;box-shadow:0 5px 14px rgba(255,122,26,.4)}
  .nav-item .ic{width:18px;text-align:center;font-size:15px;flex:none}
  .nav-item .lock{margin-left:auto;font-size:12px;opacity:.75}
  .side-foot{margin-top:auto;padding-top:16px}
  .side-user{padding:6px 10px 12px}
  .side-user b{display:block;color:#fff;font-size:14px}
  .side-user span{font-size:12px;color:#AFC3FA}
  .logout{
    width:100%;background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:10px;
    padding:11px;font-weight:700;font-size:13.5px;transition:background .12s;
  }
  .logout:hover{background:rgba(255,255,255,.24)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:20px 30px;position:sticky;top:0;z-index:5;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .topbar h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
  .topbar .sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
  .content{padding:26px 30px 60px;max-width:1180px;width:100%}

  /* ---------- COMPONENTS ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  .card.pad{padding:22px}
  .section-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;margin:0 0 4px}
  .section-title .tick{width:4px;height:17px;border-radius:3px;background:var(--accent);display:inline-block}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm)}
  .kpi .n{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1}
  .kpi .l{font-size:13px;color:var(--muted);font-weight:600;margin-top:8px}
  .kpi.accent{background:linear-gradient(160deg,#fff, #FFF6EE);border-color:#FBE0C6}
  .kpi.accent .n{color:var(--accent-press)}

  table{width:100%;border-collapse:collapse}
  thead th{
    text-align:left;font-size:11.5px;letter-spacing:.4px;color:var(--faint);
    font-weight:700;text-transform:uppercase;padding:12px 14px;border-bottom:1px solid var(--line);
  }
  tbody td{padding:14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FAFBFF}
  .client-name{font-weight:700}
  .muted{color:var(--muted)}
  .dash{color:var(--line-strong)}

  .pill{display:inline-block;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
  .pill.blue{background:var(--blue-bg);color:var(--blue)}
  .pill.amber{background:var(--amber-bg);color:var(--amber)}
  .pill.green{background:var(--green-bg);color:var(--green)}
  .pill.red{background:var(--red-bg);color:var(--red)}
  .pill.purple{background:var(--purple-bg);color:var(--purple)}
  .pill.grey{background:var(--grey-bg);color:var(--grey)}

  .icon-btn{background:transparent;border:none;color:var(--faint);font-size:15px;padding:6px 8px;border-radius:8px}
  .icon-btn:hover{background:var(--bg);color:var(--ink)}

  .empty{padding:40px 24px;text-align:center;color:var(--muted)}
  .empty .big{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px}

  /* two-column social */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .col-head{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;margin-bottom:14px}
  .col-head .dot{width:10px;height:10px;border-radius:50%}
  .content-item{border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:12px;background:#fff}
  .content-item h4{margin:0 0 6px;font-size:14.5px}
  .content-item .body{font-size:13.5px;color:#33436B;white-space:pre-wrap;line-height:1.55}
  .content-item .acts{display:flex;gap:8px;margin-top:11px}

  .todo{display:flex;align-items:flex-start;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line)}
  .todo:last-child{border-bottom:none}
  .todo input[type=checkbox]{width:19px;height:19px;margin-top:1px;accent-color:var(--accent);flex:none}
  .todo .t{flex:1;font-size:14.5px}
  .todo.done .t{text-decoration:line-through;color:var(--faint)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line-strong);border-radius:10px;font-size:14.5px;background:#FBFCFF;
  }
  .field textarea{min-height:120px;resize:vertical;line-height:1.55}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand-bot);box-shadow:0 0 0 3px var(--blue-bg)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,27,61,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.on{display:flex}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:520px;box-shadow:var(--shadow-lg);max-height:90vh;overflow:auto}
  .modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{margin:0;font-size:18px;font-weight:800}
  .modal-body{padding:22px 24px}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

  /* lock gate */
  .gate{max-width:420px;margin:40px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:38px 30px;box-shadow:var(--shadow-sm)}
  .gate .lockic{width:56px;height:56px;border-radius:14px;background:var(--accent-soft);color:var(--accent-press);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 16px}
  .gate h3{margin:0 0 6px;font-size:18px}
  .gate p{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  .gate input{width:100%;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:11px;font-size:16px;text-align:center;letter-spacing:2px}
  .gate input:focus{outline:none;border-color:var(--brand-bot);box-shadow:0 0 0 3px var(--blue-bg)}

  .sync-tag{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
  .sync-tag .d{width:7px;height:7px;border-radius:50%}
  .sync-on{background:var(--green-bg);color:var(--green)} .sync-on .d{background:var(--green)}
  .sync-off{background:var(--grey-bg);color:var(--grey)} .sync-off .d{background:var(--grey)}

  .present-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--green-bg);color:var(--green);padding:8px 14px;border-radius:999px;font-weight:700;font-size:13.5px}
  .chip .av{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}
  .chip.absent{background:var(--grey-bg);color:var(--grey)} .chip.absent .av{background:var(--faint)}

  @media(max-width:860px){
    .shell{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;gap:6px;padding:12px}
    .side-brand{width:100%;padding-bottom:8px}
    .nav-group{margin-top:0}.nav-group .label{display:none}
    .nav-item{width:auto;font-size:13px;padding:8px 10px}
    .nav-item .lock{margin-left:6px}
    .side-foot{width:100%;margin-top:6px;display:flex;align-items:center;gap:12px}
    .side-user{padding:0}.logout{width:auto;padding:8px 14px}
    .split{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}
    .content{padding:18px}
    .topbar{padding:16px 18px}
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="login-card">
    <div class="brandmark">
      <div class="logo-tile">EV</div>
      <div><h1>EduVoyage</h1><p>Operations Workspace</p></div>
    </div>
    <div class="field" style="margin-bottom:0">
      <label for="pw">Team password</label>
      <input id="pw" type="password" placeholder="Enter the team password" autocomplete="off" />
    </div>
    <p class="err" id="loginErr"></p>
    <button class="btn full" id="loginBtn">Sign in</button>
    <p class="login-hint">One shared login for the whole team. Finances and the Activity Log each need their own code, known only to the admin.</p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="shell">
    <aside class="sidebar">
      <div class="side-brand">
        <div class="logo-tile">EV</div>
        <div><h1>EduVoyage</h1><p>Operations Workspace</p></div>
      </div>

      <div class="nav-group">
        <div class="label">Overview</div>
        <button class="nav-item" data-page="dashboard"><span class="ic">▤</span> Dashboard</button>
        <button class="nav-item" data-page="attendance"><span class="ic">◷</span> Daily Sign-in</button>
      </div>

      <div class="nav-group">
        <div class="label">Work</div>
        <button class="nav-item" data-page="clients"><span class="ic">◧</span> Client Work</button>
        <button class="nav-item" data-page="webinars"><span class="ic">◈</span> Webinars</button>
        <button class="nav-item" data-page="social"><span class="ic">✦</span> Social Media</button>
        <button class="nav-item" data-page="services"><span class="ic">❯</span> Services &amp; Info</button>
        <button class="nav-item" data-page="finances"><span class="ic">▦</span> Finances <span class="lock">🔒</span></button>
      </div>

      <div class="nav-group">
        <div class="label">Private</div>
        <button class="nav-item" data-page="personal"><span class="ic">✎</span> Personal Workspace</button>
        <button class="nav-item" data-page="activity"><span class="ic">≣</span> Activity Log <span class="lock">🔒</span></button>
      </div>

      <div class="side-foot">
        <div class="side-user"><b>EduVoyage Team</b><span id="sideSync"></span></div>
        <button class="logout" id="logoutBtn">Log out</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <div class="sub" id="pageSub"></div>
        </div>
        <div id="topAction"></div>
      </div>
      <div class="content" id="view"></div>
    </div>
  </div>
</div>

<!-- generic modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head"><h3 id="mTitle">Edit</h3><button class="icon-btn" id="mClose" style="font-size:20px">✕</button></div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-foot" id="mFoot"></div>
  </div>
</div>

<script>
/* =========================================================================
   EDUVOYAGE OPERATIONS WORKSPACE
   -------------------------------------------------------------------------
   CONFIG — change these three passwords, and (optionally) turn on sync.
   ========================================================================= */
const TEAM_PASSWORD = "eduvoyage";     // shared login for everyone
const FINANCE_CODE  = "money2026";     // needed to open Finances
const ACTIVITY_CODE = "log2026";       // needed to open Activity Log

/* CROSS-DEVICE SYNC (optional).
   Leave both blank -> the workspace saves on THIS device only.
   To sync across phones/laptops: paste your Supabase Project URL + anon key
   below, and run the 3-line schema in schema.sql once inside Supabase.
   Everyone then sees the same data live. */
const SUPABASE_URL      = "https://qoluzahfjvgxsqpssatz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable__KpMdG9k3Z2aXbS39JaoGg_WB-okR89";
/* ========================================================================= */

const STORE_KEY = "eduvoyage_ws_v2";
const STATE_ID  = "main";
let sb = null, syncing = false, memoryOnly = false, memoryBlob = null;

/* ---------- seed data (the clients visible in your workspace) ---------- */
function seed(){
  return {
    clients:[
      {id:id(), inv:"#002", name:"Amos Adimah",       phone:"", service:"PR",                    country:"Canada", status:"In Progress",    follow:""},
      {id:id(), inv:"",     name:"Mr Temitope Odunsi", phone:"", service:"Study Abroad",          country:"Canada", status:"Submitted",      follow:""},
      {id:id(), inv:"",     name:"Ms Tangsi",          phone:"", service:"Study Abroad",          country:"Canada", status:"On Hold",        follow:""},
      {id:id(), inv:"",     name:"Ms Evelyn",          phone:"", service:"Study Abroad",          country:"Canada", status:"On Hold",        follow:""},
      {id:id(), inv:"",     name:"Fatimo Akerele",     phone:"", service:"Visit Visa Processing", country:"Canada", status:"Visa Reapplied", follow:""},
      {id:id(), inv:"",     name:"Chizoba Godsave",    phone:"", service:"Study Abroad",          country:"UK",     status:"Submitted",      follow:""}
    ],
    roster:["Aminat","Client Executive","Social Media Manager"],
    attendance:[],   // {name, date, time}
    webinars:[],     // {id, title, date, topic, status, notes}
    content:[],      // {id, area:'study'|'travel', title, body, week}
    finances:[],     // {id, date, desc, type:'in'|'out', amount}
    todos:[],        // {id, text, done}
    notes:"",
    activity:[]      // {ts, msg}
  };
}
let state = seed();

/* ---------- utilities ---------- */
function id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function naira(n){ return "₦"+Number(n||0).toLocaleString("en-NG"); }
function fmtDate(s){ if(!s) return "—"; const d=new Date(s); if(isNaN(d)) return esc(s); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
function fmtDateTime(s){ const d=new Date(s); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+", "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
function log(msg){ state.activity.unshift({ts:new Date().toISOString(), msg}); if(state.activity.length>400) state.activity.pop(); }

/* ---------- persistence (local + optional Supabase) ---------- */
function saveLocal(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ memoryOnly=true; memoryBlob=JSON.stringify(state); }
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ state = Object.assign(seed(), JSON.parse(raw)); return true; }
  }catch(e){
    if(memoryBlob){ try{ state=Object.assign(seed(),JSON.parse(memoryBlob)); return true; }catch(_){} }
  }
  return false;
}
async function save(){
  saveLocal();
  if(sb){
    try{ await sb.from("workspace_state").upsert({id:STATE_ID, data:state, updated_at:new Date().toISOString()}); }
    catch(e){ console.warn("sync save failed", e); }
  }
}
async function pull(){
  if(!sb) return;
  try{
    const {data,error} = await sb.from("workspace_state").select("data").eq("id",STATE_ID).maybeSingle();
    if(!error && data && data.data){ state = Object.assign(seed(), data.data); }
  }catch(e){ console.warn("sync pull failed", e); }
}
async function initSync(){
  if(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase){
    try{
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      syncing = true;
      const {data} = await sb.from("workspace_state").select("data").eq("id",STATE_ID).maybeSingle();
      if(data && data.data){ state = Object.assign(seed(), data.data); }
      else { await sb.from("workspace_state").upsert({id:STATE_ID, data:state, updated_at:new Date().toISOString()}); }
      setInterval(async ()=>{ if(document.getElementById("app").style.display!=="none"){ await pull(); renderCurrent(); } }, 15000);
      return;
    }catch(e){ console.warn("Supabase init failed, using local storage", e); sb=null; syncing=false; }
  }
  loadLocal();
}

/* ---------- login ---------- */
document.getElementById("loginBtn").onclick = tryLogin;
document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
function tryLogin(){
  const v = document.getElementById("pw").value;
  if(v === TEAM_PASSWORD){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    renderSyncTag();
    go("dashboard");
  } else {
    document.getElementById("loginErr").textContent = "That password isn't right. Try again.";
  }
}
document.getElementById("logoutBtn").onclick = ()=>{
  financeUnlocked=false; activityUnlocked=false;
  document.getElementById("app").style.display="none";
  document.getElementById("login").style.display="flex";
  document.getElementById("pw").value=""; document.getElementById("loginErr").textContent="";
};
function renderSyncTag(){
  const on = syncing;
  document.getElementById("sideSync").innerHTML =
    on ? '<span class="sync-tag sync-on"><span class="d"></span>Synced across devices</span>'
       : '<span class="sync-tag sync-off"><span class="d"></span>Saved on this device</span>';
}

/* ---------- router ---------- */
let current = "dashboard";
let financeUnlocked=false, activityUnlocked=false;
const TITLES = {
  dashboard:["Dashboard","A quick look at where things stand today"],
  attendance:["Daily Sign-in","Sign in for the day and see who's online"],
  clients:["Client Work","Every active client and where they are"],
  webinars:["Webinars","Sessions planned and delivered"],
  social:["Social Media","This week's content, ready to post"],
  services:["Services & Info","What we offer and what it costs"],
  finances:["Finances","Money in, money out"],
  personal:["Personal Workspace","Your own space"],
  activity:["Activity Log","Everything that's happened in here"]
};
function go(page){
  current = page;
  document.querySelectorAll(".nav-item").forEach(b=> b.classList.toggle("active", b.dataset.page===page));
  document.getElementById("pageTitle").textContent = TITLES[page][0];
  document.getElementById("pageSub").textContent = TITLES[page][1];
  document.getElementById("topAction").innerHTML = "";
  renderCurrent();
}
document.querySelectorAll(".nav-item").forEach(b=> b.onclick = ()=>go(b.dataset.page));
function renderCurrent(){ ({dashboard:renderDashboard,attendance:renderAttendance,clients:renderClients,webinars:renderWebinars,social:renderSocial,services:renderServices,finances:renderFinances,personal:renderPersonal,activity:renderActivity}[current])(); }
const view = ()=>document.getElementById("view");
function topBtn(label, fn){
  const el=document.getElementById("topAction");
  const b=document.createElement("button"); b.className="btn"; b.textContent=label; b.onclick=fn;
  el.innerHTML=""; el.appendChild(b);
}

/* ---------- status pill colour map ---------- */
const STATUS = {
  "New":"blue","In Progress":"blue","Submitted":"amber","On Hold":"grey",
  "Visa Reapplied":"purple","Approved":"green","Refused":"red","Completed":"green","Deferred":"amber"
};
const STATUS_LIST = Object.keys(STATUS);
function pill(status){ return `<span class="pill ${STATUS[status]||"grey"}">${esc(status||"—")}</span>`; }

function renderDashboard(){
  const t=todayStr();
  const inToday = state.attendance.filter(a=>a.date===t);

  const active = state.clients.length;
  const submitted = state.clients.filter(c=>c.status==="Submitted").length;
  const recent = state.activity.slice(0,6);
  view().innerHTML = `
    <div class="kpis">
      <div class="kpi accent"><div class="n">${active}</div><div class="l">Active clients</div></div>
      <div class="kpi"><div class="n">${inToday.length}</div><div class="l">Signed in today</div></div>
      <div class="kpi"><div class="n">${submitted}</div><div class="l">Applications submitted</div></div>
      <div class="kpi"><div class="n">${contentThisWeek}</div><div class="l">Content pieces ready</div></div>
    </div>
    <div class="card pad" style="margin-bottom:20px">
      <div class="section-title"><span class="tick"></span>Who's in today</div>
      ${inToday.length ? `<div class="present-row">${inToday.map(a=>`<span class="chip"><span class="av">${esc(a.name[0]||"?")}</span>${esc(a.name)} · ${esc(a.time)}</span>`).join("")}</div>`

/* ---------- Attendance / daily sign-in ---------- */
function renderAttendance(){
  const t=todayStr();
  const now=new Date();
  const open = now.getHours()>=10;                 // earliest 10:00
  const inToday = state.attendance.filter(a=>a.date===t);
  const signedNames = inToday.map(a=>a.name);
  const roster = state.roster;
  topBtn("Manage names", editRoster);
  view().innerHTML = `
    <div class="card pad" style="margin-bottom:20px">
      <div class="row-between">
        <div class="section-title"><span class="tick"></span>Sign in for ${now.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div>
        ${open ? "" : `<span class="pill amber">Opens at 10:00 AM</span>`}
      </div>
      ${open ? `
        <p class="muted" style="margin:6px 0 14px">Tap your name to mark yourself in for today.</p>
        <div class="present-row">
          ${roster.map(n=>{
            const inHere = signedNames.includes(n);
            return `<button class="chip ${inHere?"":"absent"}" style="border:none;cursor:${inHere?"default":"pointer"}" ${inHere?"disabled":`onclick="signIn('${esc(n)}')"`}>
              <span class="av">${esc(n[0]||"?")}</span>${esc(n)} ${inHere?"· in":""}</button>`;
          }).join("")}
        </div>`
      : `<p class="muted" style="margin:8px 0 0">Sign-in opens each day at 10:00 AM. Check back then.</p>`}
    </div>
    <div class="card pad">
      <div class="section-title"><span class="tick"></span>Signed in today (${inToday.length})</div>
      ${inToday.length ? `<div class="present-row">${inToday.map(a=>`<span class="chip"><span class="av">${esc(a.name[0]||"?")}</span>${esc(a.name)} · ${esc(a.time)}</span>`).join("")}</div>`
        : `<p class="muted" style="margin:10px 0 0">No sign-ins yet.</p>`}
    </div>`;
}
window.signIn = async function(name){
  const t=todayStr();
  if(state.attendance.some(a=>a.date===t && a.name===name)) return;
  const time=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  state.attendance.push({name, date:t, time});
  log(`${name} signed in at ${time}`);
  await save(); renderAttendance();
};
function editRoster(){
  openModal("Team names", `
    <p class="muted" style="margin-top:0">One name per line. These are the names that appear on the sign-in screen.</p>
    <div class="field"><textarea id="rosterBox">${esc(state.roster.join("\n"))}</textarea></div>
  `, async ()=>{
    const lines=document.getElementById("rosterBox").value.split("\n").map(s=>s.trim()).filter(Boolean);
    state.roster = lines.length?lines:["Aminat"];
    await save(); closeModal(); renderAttendance();
  });
}

      <div class="field"><label>Client name</label><input id="f_name" value="${esc(c.name)}" placeholder="Full name"></div>

      <div class="field"><label>Phone</label><input id="f_phone" value="${esc(c.phone)}" placeholder="Optional"></div>
      <div class="field"><label>Service</label><input id="f_service" value="${esc(c.service)}" placeholder="Study Abroad"></div>

      <div class="field"><label>Country</label><input id="f_country" value="${esc(c.country)}" placeholder="Canada"></div>
      <div class="field"><label>Status</label><select id="f_status">${STATUS_LIST.map(s=>`<option ${s===c.status?"selected":""}>${s}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>Last follow-up</label><input id="f_follow" type="date" value="${esc(c.follow)}"></div>
  `, async ()=>{
    const name=document.getElementById("f_name").value.trim();
    if(!name){ alert("Client name is needed."); return; }
    const data={inv:document.getElementById("f_inv").value.trim(),name,phone:document.getElementById("f_phone").value.trim(),
      service:document.getElementById("f_service").value.trim()||"—",country:document.getElementById("f_country").value.trim()||"—",
      status:document.getElementById("f_status").value,follow:document.getElementById("f_follow").value};
    if(cid){ Object.assign(c,data); log(`Updated client ${name}`); }

window.delClient = function(cid){
  const c=state.clients.find(x=>x.id===cid); if(!c) return;
  confirmModal(`Remove ${esc(c.name)} from the client list?`, async ()=>{
    state.clients=state.clients.filter(x=>x.id!==cid); log(`Removed client ${c.name}`); await save(); closeModal(); renderClients();
  });
};

/* ---------- Social Media ---------- */
function renderSocial(){
  topBtn("Add content", ()=>contentForm());
  const col = (area,label,color)=>{
    const items = state.content.filter(c=>c.area===area);
    return `<div class="card pad">
      <div class="col-head"><span class="dot" style="background:${color}"></span>${label} <span class="muted" style="font-weight:600;font-size:13px">(${items.length})</span></div>
      ${items.length? items.map(c=>`
        <div class="content-item">
          <h4>${esc(c.title)||"Untitled"}</h4>
          ${c.week?`<div class="muted" style="font-size:12px;margin-bottom:6px">${esc(c.week)}</div>`:""}
          <div class="body">${esc(c.body)}</div>
          <div class="acts">
            <button class="btn sm" onclick="copyContent('${c.id}',this)">Copy</button>
            <button class="btn sm ghost" onclick="contentForm('${c.id}')">Edit</button>
            <button class="icon-btn" onclick="delContent('${c.id}')">🗑</button>
          </div>
        </div>`).join("")
        : `<p class="muted">Nothing here yet for this week.</p>`}
    </div>`;
  };
  view().innerHTML=`
    <p class="muted" style="margin:0 0 16px">Finished captions and scripts, ready to copy and post. Study abroad on the left, travel and tours on the right.</p>
    <div class="split">
      ${col("study","Study Abroad","#1B47B0")}
      ${col("travel","Travel &amp; Tours","#FF7A1A")}
    </div>`;
}
window.copyContent=function(cid,btn){
  const c=state.content.find(x=>x.id===cid); if(!c) return;
  const text=(c.title?c.title+"\n\n":"")+c.body;
  navigator.clipboard.writeText(text).then(()=>{ const o=btn.textContent; btn.textContent="Copied ✓"; setTimeout(()=>btn.textContent=o,1400); })
   .catch(()=>{ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); btn.textContent="Copied ✓"; setTimeout(()=>btn.textContent="Copy",1400); });
};
window.contentForm=function(cid){
  const c=cid?state.content.find(x=>x.id===cid):{area:"study",title:"",body:"",week:"This week"};
  openModal(cid?"Edit content":"Add content",`
    <div class="grid2">
      <div class="field"><label>Where it goes</label><select id="c_area"><option value="study" ${c.area==="study"?"selected":""}>Study Abroad</option><option value="travel" ${c.area==="travel"?"selected":""}>Travel & Tours</option></select></div>
      <div class="field"><label>Week</label><input id="c_week" value="${esc(c.week)}" placeholder="e.g. Week of 1 Sept"></div>
    </div>
    <div class="field"><label>Title / hook</label><input id="c_title" value="${esc(c.title)}" placeholder="Short label so you know what it is"></div>
    <div class="field"><label>Caption or script</label><textarea id="c_body" style="min-height:180px" placeholder="Paste the finished content here...">${esc(c.body)}</textarea></div>
  `, async ()=>{
    const body=document.getElementById("c_body").value.trim(); if(!body){alert("Add the content text.");return;}
    const data={area:document.getElementById("c_area").value,week:document.getElementById("c_week").value.trim(),title:document.getElementById("c_title").value.trim(),body};
    if(cid){Object.assign(c,data);log(`Edited ${data.area==="study"?"study abroad":"travel"} content`);}
    else{state.content.push(Object.assign({id:id()},data));log(`Added ${data.area==="study"?"study abroad":"travel"} content`);}
    await save(); closeModal(); renderSocial();
  });
};
window.delContent=function(cid){ confirmModal("Delete this content?", async ()=>{ state.content=state.content.filter(x=>x.id!==cid); await save(); closeModal(); renderSocial(); }); };

/* ---------- Finances (code-locked) ---------- */
function renderFinances(){
  if(!financeUnlocked){ return gate("Finances","This page is private. Enter the finance code to view it.", ()=>{financeUnlocked=true;renderFinances();}, FINANCE_CODE); }
  topBtn("Add entry", ()=>financeForm());
  let inSum=0,outSum=0;
  state.finances.forEach(f=> f.type==="in"?inSum+=Number(f.amount):outSum+=Number(f.amount));
  const rows=[...state.finances].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(f=>`
    <tr>
      <td>${fmtDate(f.date)}</td>
      <td class="client-name">${esc(f.desc)}</td>
      <td>${f.type==="in"?'<span class="pill green">Money in</span>':'<span class="pill red">Money out</span>'}</td>
      <td style="text-align:right;font-weight:700;color:${f.type==="in"?"var(--green)":"var(--red)"}">${f.type==="in"?"+":"−"}${naira(f.amount)}</td>
      <td style="text-align:right"><button class="icon-btn" onclick="financeForm('${f.id}')">✎</button><button class="icon-btn" onclick="delFinance('${f.id}')">🗑</button></td>
    </tr>`).join("");
  view().innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n" style="color:var(--green)">${naira(inSum)}</div><div class="l">Total in</div></div>
      <div class="kpi"><div class="n" style="color:var(--red)">${naira(outSum)}</div><div class="l">Total out</div></div>
      <div class="kpi accent"><div class="n">${naira(inSum-outSum)}</div><div class="l">Balance</div></div>
    </div>
    <div class="card">
      <div class="pad" style="padding-bottom:6px;display:flex;justify-content:space-between;align-items:center">
        <div class="section-title"><span class="tick"></span>Ledger</div>
        <button class="btn sm ghost" onclick="financeUnlocked=false;renderFinances()">Lock again</button>
      </div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Date</th><th>Description</th><th>Type</th><th style="text-align:right">Amount</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5" class="empty"><div class="big">No entries yet</div>Add money in or out to start the ledger.</td></tr>`}</tbody>
      </table></div>
    </div>`;
}

  view().innerHTML=`
    <div class="card pad" style="margin-bottom:20px">
      <div class="row-between" style="margin-bottom:8px">
        <div class="section-title"><span class="tick"></span>To-dos</div>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:8px">
        <input id="todoInput" placeholder="Add something to do..." style="flex:1;padding:11px 12px;border:1.5px solid var(--line-strong);border-radius:10px;font-size:14.5px;background:#FBFCFF">
        <button class="btn" onclick="addTodo()">Add</button>
      </div>
      <div id="todoList">${renderTodoList()}</div>
    </div>
    <div class="card pad">
      <div class="section-title"><span class="tick"></span>Notes</div>
      <p class="muted" style="margin:6px 0 12px">Anything you like — ideas, reminders, drafts. Saves as you type.</p>
      <textarea id="notesBox" style="width:100%;min-height:260px;border:1.5px solid var(--line-strong);border-radius:12px;padding:14px;font-size:14.5px;line-height:1.6;background:#FBFCFF;resize:vertical" placeholder="Start writing...">${esc(state.notes)}</textarea>
    </div>`;
  const box=document.getElementById("notesBox");
  let tmr; box.addEventListener("input",()=>{ clearTimeout(tmr); tmr=setTimeout(async ()=>{ state.notes=box.value; await save(); },500); });
  document.getElementById("todoInput").addEventListener("keydown",e=>{ if(e.key==="Enter") addTodo(); });
}
function renderTodoList(){
  if(!state.todos.length) return `<p class="muted">Nothing on the list. Add your first task above.</p>`;
  return state.todos.map(t=>`
    <div class="todo ${t.done?"done":""}">
      <input type="checkbox" ${t.done?"checked":""} onchange="toggleTodo('${t.id}')">
      <span class="t">${esc(t.text)}</span>
      <button class="icon-btn" onclick="delTodo('${t.id}')">🗑</button>
    </div>`).join("");
}
window.addTodo=async function(){ const i=document.getElementById("todoInput"); const v=i.value.trim(); if(!v)return; state.todos.push({id:id(),text:v,done:false}); i.value=""; await save(); document.getElementById("todoList").innerHTML=renderTodoList(); };
window.toggleTodo=async function(tid){ const t=state.todos.find(x=>x.id===tid); if(t){t.done=!t.done; await save(); document.getElementById("todoList").innerHTML=renderTodoList();} };
window.delTodo=async function(tid){ state.todos=state.todos.filter(x=>x.id!==tid); await save(); document.getElementById("todoList").innerHTML=renderTodoList(); };

/* ---------- Activity Log (code-locked) ---------- */
function renderActivity(){
  if(!activityUnlocked){ return gate("Activity Log","This page is private. Enter the activity code to view it.", ()=>{activityUnlocked=true;renderActivity();}, ACTIVITY_CODE); }
  const rows=state.activity.map(a=>`<div style="display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)"><span style="font-size:14px">${esc(a.msg)}</span><span class="muted" style="font-size:12.5px;white-space:nowrap">${fmtDateTime(a.ts)}</span></div>`).join("");
  view().innerHTML=`
    <div class="card pad">
      <div class="row-between" style="margin-bottom:6px">
        <div class="section-title"><span class="tick"></span>Everything that's happened (${state.activity.length})</div>
        <button class="btn sm ghost" onclick="activityUnlocked=false;renderActivity()">Lock again</button>
      </div>
      ${rows || `<p class="muted" style="margin-top:10px">Nothing logged yet.</p>`}
    </div>`;
}

/* ---------- code gate ---------- */
function gate(title,msg,onOk,code){
  view().innerHTML=`
    <div class="gate">
      <div class="lockic">🔒</div>
      <h3>${esc(title)}</h3><p>${esc(msg)}</p>
      <input id="gateInput" type="password" placeholder="••••••" autocomplete="off">
      <p class="err" id="gateErr" style="text-align:center"></p>
      <button class="btn full" id="gateBtn">Unlock</button>
    </div>`;
  const inp=document.getElementById("gateInput");
  const attempt=()=>{ if(inp.value===code){ onOk(); } else { document.getElementById("gateErr").textContent="Wrong code."; inp.value=""; } };
  document.getElementById("gateBtn").onclick=attempt;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") attempt(); });
  inp.focus();
}

/* ---------- modal helpers ---------- */
function openModal(title,bodyHTML,onSave,saveLabel){
  document.getElementById("mTitle").textContent=title;
  document.getElementById("mBody").innerHTML=bodyHTML;
  const foot=document.getElementById("mFoot");
  foot.innerHTML="";
  const cancel=document.createElement("button"); cancel.className="btn ghost"; cancel.textContent="Cancel"; cancel.onclick=closeModal;
  const ok=document.createElement("button"); ok.className="btn"; ok.textContent=saveLabel||"Save"; ok.onclick=onSave;
  foot.appendChild(cancel); foot.appendChild(ok);
  document.getElementById("overlay").classList.add("on");
}
function confirmModal(msg,onYes){
  document.getElementById("mTitle").textContent="Please confirm";
  document.getElementById("mBody").innerHTML=`<p style="margin:0">${msg}</p>`;
  const foot=document.getElementById("mFoot"); foot.innerHTML="";
  const cancel=document.createElement("button"); cancel.className="btn ghost"; cancel.textContent="Cancel"; cancel.onclick=closeModal;
  const yes=document.createElement("button"); yes.className="btn danger"; yes.textContent="Yes, delete"; yes.onclick=onYes;
  foot.appendChild(cancel); foot.appendChild(yes);
  document.getElementById("overlay").classList.add("on");
}
function closeModal(){ document.getElementById("overlay").classList.remove("on"); }
document.getElementById("mClose").onclick=closeModal;
document.getElementById("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); });

/* ---------- boot ---------- */
(async function(){ await initSync(); })();
</script>
</body>
</html>
