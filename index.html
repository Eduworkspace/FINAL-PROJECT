<style>
  :root{
    --ink:#EBEFF7;
    --muted:#9BA7BE;
    --faint:#6C778F;
    --navy:#0F1622;
    --navy-2:#161F30;
    --accent:#E8873F;
    --accent-press:#CF6F2C;
    --accent-soft:#3A2A1C;
    --bg:#07090E;
    --surface:#141A24;
    --line:#252D3B;
    --line-strong:#343E50;
    --green:#5FD39A; --green-bg:#152A20;
    --amber:#E0B24E; --amber-bg:#2B2415;
    --blue:#7FA6EC;  --blue-bg:#172338;
    --red:#EC8B82;   --red-bg:#301B19;
    --purple:#B199E8;--purple-bg:#241C39;
    --grey:#9BA7BE;  --grey-bg:#1E2531;
    --radius:16px;
    --shadow-sm:0 1px 2px rgba(28,43,71,.05);
    --shadow-md:0 8px 26px rgba(28,43,71,.09);
    --shadow-lg:0 24px 60px rgba(28,43,71,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.55; font-weight:600;
    letter-spacing:-.01em;
  }
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;color:inherit}

  /* ---------- LOGIN ---------- */
  #login{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(165deg,#233457 0%, #1E2C49 55%, #17223B 100%);
    padding:24px;
  }
  .login-card{
    width:100%; max-width:400px; background:var(--surface); border-radius:22px;
    padding:38px 32px; box-shadow:var(--shadow-lg);
  }
  .brandmark{display:flex;align-items:center;gap:13px;margin-bottom:26px}
  .logo-tile{
    width:48px;height:48px;border-radius:13px;flex:none;
    background:linear-gradient(150deg,var(--accent),#EC9A5F);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:17px;letter-spacing:.5px;
    box-shadow:0 8px 18px rgba(224,124,62,.32);
  }
  .logo-tile img{width:100%;height:100%;object-fit:contain;display:block}
  .login-logo{width:240px;max-width:78%;height:auto;display:block}
  .brandmark h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em}
  .brandmark p{margin:1px 0 0;font-size:12.5px;color:var(--muted);font-weight:500}
  .login-card label{display:block;font-size:13px;font-weight:600;margin:0 0 8px}
  .login-card input{
    width:100%;padding:14px 15px;border:1.5px solid var(--line-strong);
    border-radius:12px;font-size:15px;background:#FBFAF8;font-weight:500;
  }
  .login-card input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,44,73,.10)}
  #login .login-card{background:#fff;color:#1C2B47}
  #login .login-card label{color:#1C2B47}
  #login .login-card input{background:#FBFAF8;color:#1C2B47;border-color:#DED8CE}
  .login-hint{font-size:12.5px;color:var(--muted);margin:16px 0 0;line-height:1.6;font-weight:500}
  .err{color:var(--red);font-size:13px;font-weight:500;margin:12px 0 0;min-height:18px}

  .btn{
    border:none;border-radius:12px;font-weight:600;font-size:14.5px;
    padding:12px 20px;background:var(--accent);color:#fff;transition:background .15s, transform .05s;
    box-shadow:0 5px 14px rgba(224,124,62,.26);letter-spacing:-.01em;
  }
  .btn:hover{background:var(--accent-press)}
  .btn:active{transform:translateY(1px)}
  .btn.full{width:100%;margin-top:22px}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid var(--line-strong);font-weight:600}
  .btn.ghost:hover{background:var(--bg)}
  .btn.sm{padding:9px 14px;font-size:13px;border-radius:10px}
  .btn.danger{background:var(--red)}
  .btn.danger:hover{background:#963831}

  /* ---------- SHELL ---------- */
  #app{display:none;min-height:100vh}
  .shell{display:flex;min-height:100vh}
  .sidebar{
    width:264px;flex:none;color:#E7E9F0;
    background:linear-gradient(185deg,var(--navy) 0%, var(--navy-2) 100%);
    display:flex;flex-direction:column;padding:20px 16px;position:sticky;top:0;height:100vh;
    overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;
  }
  .sidebar::-webkit-scrollbar{width:7px}
  .sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:4px}
  .side-brand{display:flex;align-items:center;gap:12px;padding:6px 10px 16px}
  .side-brand .logo-tile{width:42px;height:42px;font-size:15px}
  .side-brand h1{font-size:17px;margin:0;color:#fff;font-weight:700;letter-spacing:-.02em}
  .side-brand p{margin:1px 0 0;font-size:11.5px;color:#9BA6C2;font-weight:500}
  .nav-group{margin-top:12px}
  .nav-group .label{
    font-size:10.5px;letter-spacing:1.2px;color:#8290B0;font-weight:600;
    padding:0 12px 9px;text-transform:uppercase;
  }
  .nav-item{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;position:relative;
    background:transparent;border:none;color:#C9CFDF;font-weight:500;font-size:14.5px;
    padding:11px 13px;border-radius:11px;transition:background .13s,color .13s;letter-spacing:-.01em;
  }
  .nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav-item.active{background:rgba(255,255,255,.09);color:#fff;font-weight:600}
  .nav-item.active::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
  .nav-item .ic{width:18px;text-align:center;font-size:15px;flex:none;opacity:.9}
  .nav-item .lock{margin-left:auto;font-size:12px;opacity:.65}
  .side-foot{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)}
  .side-user{padding:12px 12px 14px}
  .side-user b{display:block;color:#fff;font-size:14px;font-weight:600}
  .side-user span{font-size:12px;color:#9BA6C2}
  .logout{
    width:100%;background:rgba(255,255,255,.10);color:#fff;border:none;border-radius:11px;
    padding:12px;font-weight:600;font-size:13.5px;transition:background .13s;
  }
  .logout:hover{background:rgba(255,255,255,.20)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:24px 36px;position:sticky;top:0;z-index:5;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .topbar h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.03em}
  .topbar .sub{font-size:13px;color:var(--muted);font-weight:500;margin-top:3px}
  .content{padding:30px 36px 64px;max-width:1200px;width:100%}

  /* ---------- COMPONENTS ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  .card.pad{padding:26px}
  .section-title{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
  .section-title .tick{width:4px;height:18px;border-radius:3px;background:var(--accent);display:inline-block}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;margin-bottom:28px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow-sm)}
  .kpi .n{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--ink)}
  .kpi .l{font-size:13px;color:var(--muted);font-weight:500;margin-top:10px}
  .kpi.accent{background:linear-gradient(160deg,#1C2331,#241a12);border-color:#4a3320}
  .kpi.accent .n{color:var(--accent-press)}

  table{width:100%;border-collapse:collapse}
  thead th{
    text-align:left;font-size:11px;letter-spacing:.6px;color:var(--faint);
    font-weight:600;text-transform:uppercase;padding:13px 15px;border-bottom:1px solid var(--line);
  }
  tbody td{padding:15px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;font-weight:500}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#1C2432}
  .client-name{font-weight:600}
  .muted{color:var(--muted)}
  .dash{color:var(--line-strong)}

  .pill{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill.blue{background:var(--blue-bg);color:var(--blue)}
  .pill.amber{background:var(--amber-bg);color:var(--amber)}
  .pill.green{background:var(--green-bg);color:var(--green)}
  .pill.red{background:var(--red-bg);color:var(--red)}
  .pill.purple{background:var(--purple-bg);color:var(--purple)}
  .pill.grey{background:var(--grey-bg);color:var(--grey)}

  .icon-btn{background:transparent;border:none;color:var(--muted);font-size:18px;padding:9px 11px;border-radius:9px;cursor:pointer}
  .icon-btn:hover{background:var(--bg);color:var(--ink)}
  .icon-btn.edit{color:var(--accent)}
  .icon-btn.del{color:var(--red)}
  .social-grid{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:720px){ .social-grid{grid-template-columns:1fr 1fr} }
  .social-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:#1B2230}
  .social-badge{width:38px;height:38px;border-radius:10px;flex:none;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px}
  .social-meta{flex:1;min-width:0}
  .social-plat{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .social-handle{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .social-card .btn.sm{flex:none;text-decoration:none}
  .svc-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .svc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
  .svc-name{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .svc-fees{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .svc-fee{flex:1;min-width:130px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .svc-fee-l{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
  .svc-fee-v{font-size:16px;font-weight:700;color:var(--ink)}
  .svc-reqs-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:6px}
  .svc-reqs ul{margin:0;padding:0;list-style:none}
  .svc-reqs li{position:relative;padding:7px 0 7px 20px;font-size:13.5px;line-height:1.5;border-bottom:1px solid var(--line);font-weight:500}
  .svc-reqs li:last-child{border-bottom:none}
  .svc-reqs li::before{content:"";position:absolute;left:3px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  /* Keep edit/delete pinned to the right so they're always reachable when a wide table scrolls */
  th.col-actions,td.col-actions{position:sticky;right:0;background:var(--surface);white-space:nowrap;text-align:right;box-shadow:-10px 0 14px rgba(20,30,50,.05)}
  tbody tr:hover td.col-actions{background:#1C2432}

  .empty{padding:46px 24px;text-align:center;color:var(--muted)}
  .empty .big{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .col-head{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin-bottom:16px;letter-spacing:-.01em}
  .col-head .dot{width:10px;height:10px;border-radius:50%}
  .content-item{border:1px solid var(--line);border-radius:13px;padding:16px 17px;margin-bottom:13px;background:#1B2230}
  .content-item h4{margin:0 0 6px;font-size:14.5px;font-weight:600}
  .content-item .body{font-size:13.5px;color:#C3CCDC;white-space:pre-wrap;line-height:1.6;font-weight:500}
  .content-item .acts{display:flex;gap:8px;margin-top:13px}

  .todo{display:flex;align-items:flex-start;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .todo:last-child{border-bottom:none}
  .todo input[type=checkbox]{width:19px;height:19px;margin-top:1px;accent-color:var(--accent);flex:none}
  .todo .t{flex:1;font-size:14.5px;font-weight:500}
  .todo.done .t{text-decoration:line-through;color:var(--faint)}

  .field{margin-bottom:15px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
  .field input,.field select,.field textarea{
    width:100%;padding:12px 13px;border:1.5px solid var(--line-strong);border-radius:11px;font-size:14.5px;background:#0E141E;font-weight:500;
  }
  .field textarea{min-height:120px;resize:vertical;line-height:1.6}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,44,73,.10)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.on{display:flex}
  .modal{background:var(--surface);border-radius:20px;width:100%;max-width:530px;box-shadow:var(--shadow-lg);max-height:90vh;overflow:auto}
  .modal-head{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em}
  .modal-body{padding:24px 26px}
  .modal-foot{padding:18px 26px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

  .gate{max-width:430px;margin:44px auto;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:42px 32px;box-shadow:var(--shadow-sm)}
  .gate .lockic{width:58px;height:58px;border-radius:15px;background:var(--accent-soft);color:var(--accent-press);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 18px}
  .gate h3{margin:0 0 6px;font-size:18px;font-weight:700}
  .gate p{color:var(--muted);font-size:13.5px;margin:0 0 20px;font-weight:500}
  .gate input{width:100%;padding:13px 15px;border:1.5px solid var(--line-strong);border-radius:12px;font-size:16px;text-align:center;letter-spacing:2px;background:#0E141E}
  .gate input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,44,73,.10)}

  .sync-tag{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
  .sync-tag .d{width:7px;height:7px;border-radius:50%}
  .sync-on{background:var(--green-bg);color:var(--green)} .sync-on .d{background:var(--green)}
  .sync-off{background:var(--grey-bg);color:var(--grey)} .sync-off .d{background:var(--grey)}

  .present-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--green-bg);color:var(--green);padding:8px 15px;border-radius:999px;font-weight:600;font-size:13.5px}
  .chip .av{width:23px;height:23px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
  .chip.absent{background:var(--grey-bg);color:var(--grey)} .chip.absent .av{background:var(--faint)}

  @media(max-width:860px){
    .shell{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;gap:6px;padding:14px}
    .side-brand{width:100%;padding-bottom:10px}
    .nav-group{margin-top:0}.nav-group .label{display:none}
    .nav-item{width:auto;font-size:13px;padding:9px 11px}
    .nav-item.active::before{display:none}
    .nav-item .lock{margin-left:6px}
    .side-foot{width:100%;margin-top:8px;border-top:none;display:flex;align-items:center;gap:12px}
    .side-user{padding:0}.logout{width:auto;padding:9px 15px}
    .split{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}
    .content{padding:20px}
    .topbar{padding:18px 20px}
  }

</style>
</head>

/* ---------- utilities ---------- */
function id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function naira(n){ return "₦"+Number(n||0).toLocaleString("en-NG"); }

function fmtDateTime(s){ const d=new Date(s); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+", "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
function log(msg){ state.activity.unshift({ts:new Date().toISOString(), msg}); if(state.activity.length>400) state.activity.pop(); }

/* ---------- persistence (local + optional Supabase) ---------- */
function saveLocal(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ memoryOnly=true; memoryBlob=JSON.stringify(state); }

function loadLocal(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ state = Object.assign(seed(), JSON.parse(raw)); return true; }
  }catch(e){

/* union two arrays by a key, keeping remote's version on conflict, then any local-only extras */
function unionBy(remoteArr, localArr, keyFn){
  const out = Array.isArray(remoteArr) ? remoteArr.slice() : [];
  const seen = new Set(out.map(keyFn));
  (Array.isArray(localArr)?localArr:[]).forEach(item=>{ const k=keyFn(item); if(!seen.has(k)){ out.push(item); seen.add(k);} });
  return out;
}
/* merge a remote copy with a local copy so nothing on this device is silently lost */
function mergeState(local, remote){
  local  = Object.assign(seed(), local||{});
  remote = Object.assign(seed(), remote||{});
  const m = Object.assign({}, remote);
  m.clients    = unionBy(remote.clients,    local.clients,    x=>x.id);
  m.attendance = unionBy(remote.attendance, local.attendance, x=>x.name+"|"+x.date);
  m.webinars   = unionBy(remote.webinars,   local.webinars,   x=>x.id);
  m.content    = unionBy(remote.content,    local.content,    x=>x.id);
  m.finances   = unionBy(remote.finances,   local.finances,   x=>x.id);
  m.services   = unionBy(remote.services,    local.services,    x=>x.id);
  m.socials    = unionBy(remote.socials,     local.socials,     x=>x.id);
  m.todos      = unionBy(remote.todos,      local.todos,      x=>x.id);
  m.activity   = unionBy(remote.activity,   local.activity,   x=>x.ts+"|"+x.msg).slice(0,400);
  m.roster     = unionBy((remote.roster||[]).map(n=>({v:n})), (local.roster||[]).map(n=>({v:n})), x=>x.v).map(x=>x.v);
  m.notes      = (remote.notes && remote.notes.length) ? remote.notes : (local.notes||"");
  return m;
}
async function pull(){
  if(!sb) return;
  try{
    const {data,error} = await sb.from("workspace_state").select("data").eq("id",STATE_ID).maybeSingle();
    if(!error && data && data.data){
      const remote = data.data;
      /* adopt the shared copy, but never drop a sign-in this device just made */
      const keepAttendance = unionBy(remote.attendance, state.attendance, x=>x.name+"|"+x.date);
      state = Object.assign(seed(), remote);
      state.attendance = keepAttendance;
    }
  }catch(e){ console.warn("sync pull failed", e); }
}

    try{
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      loadLocal();                         // whatever this device last had
      const localAttendance = Array.isArray(state.attendance) ? state.attendance : [];
      /* REAL connection test: read the shared row and check for an error */
      const {data, error} = await sb.from("workspace_state").select("data").eq("id",STATE_ID).maybeSingle();
      if(error){ throw new Error(error.message || (error.code?("code "+error.code):"read failed")); }
      if(data && data.data){
        const remote = data.data;
        const keepAttendance = unionBy(remote.attendance, localAttendance, x=>x.name+"|"+x.date);
        state = Object.assign(seed(), remote);
        state.attendance = keepAttendance;
      }
      /* REAL write test: push and confirm no error */
      const up = await sb.from("workspace_state").upsert({id:STATE_ID, data:state, updated_at:new Date().toISOString()});
      if(up && up.error){ throw new Error(up.error.message || (up.error.code?("code "+up.error.code):"write failed")); }
      syncing = true; syncError = null;    // only now is it truly synced
      setInterval(async ()=>{
        if(document.getElementById("app").style.display==="none") return;   // not signed in
        const el = document.activeElement;
        const typing = el && (el.tagName==="INPUT" || el.tagName==="TEXTAREA" || el.isContentEditable);
        const overlay = document.getElementById("overlay");
        const modalOpen = overlay && overlay.classList.contains("on");
        if(typing || modalOpen) return;   // never redraw while someone is typing or filling a form
        await pull(); renderCurrent();
      }, 15000);
      return;
    }catch(e){ console.warn("Supabase sync not working:", e); sb=null; syncing=false; syncError=(e&&e.message)?e.message:String(e); }
  }
  loadLocal();
}

window.exportBackup = function(){
  try{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "eduvoyage-backup-"+todayStr()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    log("Backup exported"); save();
  }catch(e){ alert("Could not export backup: "+e.message); }
};
window.importBackup = function(input){
  const file = input.files && input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data; try{ data = JSON.parse(reader.result); }catch(e){ alert("That file isn't a valid backup."); input.value=""; return; }
    if(!data || !Array.isArray(data.clients)){ alert("That file doesn't look like an EduVoyage backup."); input.value=""; return; }
    confirmModal("Restore this backup? It will merge the backup into your current workspace — nothing already here will be deleted.", async ()=>{
      state = mergeState(state, data);   // union, loses nothing from either side
      log("Backup restored from file");
      await save(); closeModal(); renderCurrent();
    });
    input.value="";
  };
  reader.readAsText(file);
};

/* Previous days — grouped by date, most recent first. The data has always been
   saved; this simply shows the days before today so nothing looks lost. */
function renderAttendanceHistory(today){
  const past = state.attendance.filter(a=>a.date!==today);
  if(!past.length) return "";
  const byDate = {};
  past.forEach(a=>{ (byDate[a.date]=byDate[a.date]||[]).push(a); });
  const dates = Object.keys(byDate).sort().reverse().slice(0,14);   // last 14 days with sign-ins
  const fmt = d => { const dt=new Date(d+"T00:00:00"); return isNaN(dt)?d:dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); };
  return `
    <div class="card pad">
      <div class="section-title"><span class="tick"></span>Previous days</div>
      <p class="muted" style="margin:6px 0 14px">Sign-in history, most recent first.</p>

        <div style="margin-bottom:14px">
          <div style="font-weight:600;margin-bottom:8px">${fmt(d)} <span class="muted" style="font-weight:500">· ${byDate[d].length} in</span></div>
          <div class="present-row">
            ${byDate[d].sort((x,y)=>(x.time||"").localeCompare(y.time||"")).map(a=>`<span class="chip"><span class="av">${esc(a.name[0]||"?")}</span>${esc(a.name)} · ${esc(a.time)}</span>`).join("")}

}

    const items = state.content.filter(c=>c.area===area).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));
    return `<div class="card pad">
      <div class="col-head"><span class="dot" style="background:${color}"></span>${label} <span class="muted" style="font-weight:600;font-size:13px">(${items.length})</span></div>
      ${items.length? items.map(c=>`
        <div class="content-item">
          <h4>${esc(c.title)||"Untitled"}</h4>
          ${(c.date||c.week)?`<div class="muted" style="font-size:12px;margin-bottom:6px">${c.date?"📅 "+fmtDate(c.date):""}${c.date&&c.week?" · ":""}${esc(c.week||"")}</div>`:""}
          <div class="body">${esc(c.body)}</div>
          <div class="acts">
            <button class="btn sm" onclick="copyContent('${c.id}',this)">Copy</button>
            <button class="btn sm ghost" onclick="contentForm('${c.id}')">Edit</button>
            <button class="icon-btn" onclick="delContent('${c.id}')">🗑</button>
          </div>
        </div>`).join("")
        : `<p class="muted">Nothing here yet for this week.</p>`}
    </div>`;
  };
  view().innerHTML=`
    ${renderSocialHub()}
    <div class="section-title" style="margin:6px 0 14px"><span class="tick"></span>Content planner</div>
    <p class="muted" style="margin:0 0 16px">Finished captions and scripts, ready to copy and post. Study abroad on the left, travel and tours on the right.</p>
    <div class="split">
      ${col("study","Study Abroad","#1B47B0")}
      ${col("travel","Travel &amp; Tours","#FF7A1A")}
    </div>`;
}
const PLAT = {
  Instagram:{c:"#E1306C",i:"IG"}, TikTok:{c:"#111827",i:"TT"}, Facebook:{c:"#1877F2",i:"FB"},
  "Twitter / X":{c:"#111827",i:"X"}, YouTube:{c:"#FF0000",i:"YT"}, WhatsApp:{c:"#25D366",i:"WA"}, Other:{c:"#6B7280",i:"•"}
};
const PLAT_LIST = Object.keys(PLAT);
function renderSocialHub(){
  const socials = state.socials||[];
  const groups = [...new Set(socials.map(s=>s.group))];
  const groupBlock = g => {
    const list = socials.filter(s=>s.group===g);
    return `<div style="margin-bottom:18px">
      <div class="muted" style="font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px">${esc(g)}</div>
      <div class="social-grid">
        ${list.map(s=>{ const p=PLAT[s.platform]||PLAT.Other; return `
          <div class="social-card">
            <div class="social-badge" style="background:${p.c}">${p.i}</div>
            <div class="social-meta"><div class="social-plat">${esc(s.platform)}</div><div class="social-handle">${esc(s.handle)}</div></div>
            <a class="btn sm" href="${esc(s.url)}" target="_blank" rel="noopener">Open</a>
            <button class="icon-btn edit" onclick="socialForm('${s.id}')">✎</button>
            <button class="icon-btn del" onclick="delSocial('${s.id}')">🗑</button>
          </div>`;}).join("")}
      </div>
    </div>`;
  };
  return `
    <div class="card pad" style="margin-bottom:22px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div class="section-title" style="margin:0"><span class="tick"></span>Our pages</div>
        <button class="btn sm ghost" onclick="socialForm()">Add page</button>
      </div>
      ${socials.length ? groups.map(groupBlock).join("") : `<p class="muted" style="margin:0">No pages yet. Use “Add page”.</p>`}
      <p class="muted" style="font-size:12px;margin:2px 0 0">Tap Open to jump straight to the page in the app, ready to post.</p>
    </div>`;
}
window.socialForm=function(sid){
  const s=sid?(state.socials||[]).find(x=>x.id===sid):{group:"Study Abroad",platform:"Instagram",handle:"",url:""};
  const groups=["Study Abroad","Travel & Tours","Personal"];
  openModal(sid?"Edit page":"Add page",`
    <div class="grid2">
      <div class="field"><label>Group</label><select id="so_group">${groups.map(g=>`<option ${g===s.group?"selected":""}>${g}</option>`).join("")}</select></div>
      <div class="field"><label>Platform</label><select id="so_plat">${PLAT_LIST.map(p=>`<option ${p===s.platform?"selected":""}>${p}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>Handle / name</label><input id="so_handle" value="${esc(s.handle)}" placeholder="@yourpage"></div>
    <div class="field"><label>Link</label><input id="so_url" value="${esc(s.url)}" placeholder="https://..."></div>
  `, async ()=>{
    const url=document.getElementById("so_url").value.trim();
    const handle=document.getElementById("so_handle").value.trim();
    if(!url){ alert("Add the page link."); return; }
    const data={group:document.getElementById("so_group").value,platform:document.getElementById("so_plat").value,handle:handle||"—",url};
    if(!Array.isArray(state.socials)) state.socials=[];
    if(sid){ Object.assign(s,data); log(`Updated page — ${handle}`); }
    else { state.socials.push(Object.assign({id:id()},data)); log(`Added page — ${handle}`); }

  });
};
window.delSocial=function(sid){
  const s=(state.socials||[]).find(x=>x.id===sid); if(!s) return;
  confirmModal(`Remove ${esc(s.handle)} from pages?`, async ()=>{ state.socials=state.socials.filter(x=>x.id!==sid); log(`Removed page ${s.handle}`); await save(); closeModal(); renderSocial(); });
};
window.copyContent=function(cid,btn){
  const c=state.content.find(x=>x.id===cid); if(!c) return;
  const text=(c.title?c.title+"\n\n":"")+c.body;
  navigator.clipboard.writeText(text).then(()=>{ const o=btn.textContent; btn.textContent="Copied ✓"; setTimeout(()=>btn.textContent=o,1400); })
   .catch(()=>{ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); btn.textContent="Copied ✓"; setTimeout(()=>btn.textContent="Copy",1400); });
};
window.contentForm=function(cid){
  const c=cid?state.content.find(x=>x.id===cid):{area:"study",title:"",body:"",week:"",date:""};
  openModal(cid?"Edit content":"Add content",`
    <div class="grid2">
      <div class="field"><label>Where it goes</label><select id="c_area"><option value="study" ${c.area==="study"?"selected":""}>Study Abroad</option><option value="travel" ${c.area==="travel"?"selected":""}>Travel & Tours</option></select></div>
      <div class="field"><label>Post date</label><input id="c_date" type="date" value="${esc(c.date)}"></div>
    </div>
    <div class="field"><label>Week / label (optional)</label><input id="c_week" value="${esc(c.week)}" placeholder="e.g. Week of 1 Sept"></div>
    <div class="field"><label>Title / hook</label><input id="c_title" value="${esc(c.title)}" placeholder="Short label so you know what it is"></div>
    <div class="field"><label>Caption or script</label><textarea id="c_body" style="min-height:180px" placeholder="Paste the finished content here...">${esc(c.body)}</textarea></div>
  `, async ()=>{
    const body=document.getElementById("c_body").value.trim(); if(!body){alert("Add the content text.");return;}
    const data={area:document.getElementById("c_area").value,date:document.getElementById("c_date").value,week:document.getElementById("c_week").value.trim(),title:document.getElementById("c_title").value.trim(),body};
    if(cid){Object.assign(c,data);log(`Edited ${data.area==="study"?"study abroad":"travel"} content`);}
    else{state.content.push(Object.assign({id:id()},data));log(`Added ${data.area==="study"?"study abroad":"travel"} content`);}
    await save(); closeModal(); renderSocial();
  });
};
window.delContent=function(cid){ confirmModal("Delete this content?", async ()=>{ state.content=state.content.filter(x=>x.id!==cid); await save(); closeModal(); renderSocial(); }); };

/* ---------- Services & Info ---------- */

  const fee = n => Number(n)>0 ? naira(n) : '<span class="dash">—</span>';
  const group = (cat) => {
    const list = state.services.filter(s=>s.category===cat);
    return `
    <div style="margin-bottom:24px">
      <div class="section-title" style="margin-bottom:14px"><span class="tick"></span>${esc(cat)}</div>
      ${list.length ? list.map(s=>{
        const reqs = (s.reqs||"").split(/\n|,/).map(x=>x.trim()).filter(Boolean);
        return `

          <div class="svc-top">

    </div>`;
}

/* ---------- Finances (code-locked) ---------- */
const CAT_LIST = ["Income","Expense","Salary","Other"];
function catType(cat){ return cat==="Income" ? "in" : "out"; }
function catPill(f){
  const map={ Income:"green", Expense:"red", Salary:"purple", Other:"grey" };
  const label = f.cat || (f.type==="in"?"Income":"Expense");
  return `<span class="pill ${map[label]||"grey"}">${esc(label)}</span>`;
}
function renderFinances(){
  topBtn("Add entry", ()=>financeForm());
  const thisMonth = todayStr().slice(0,7);   // YYYY-MM
  let inSum=0,outSum=0, expMonth=0, salMonth=0;
  state.finances.forEach(f=>{
    const amt=Number(f.amount)||0;
    const type = f.type || catType(f.cat);
    if(type==="in") inSum+=amt; else outSum+=amt;
    if((f.date||"").slice(0,7)===thisMonth){
      if(f.cat==="Expense") expMonth+=amt;
      if(f.cat==="Salary")  salMonth+=amt;
    }
  });
  const rows=[...state.finances].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(f=>{
    const type=f.type||catType(f.cat), amt=Number(f.amount)||0;
    return `
    <tr>
      <td>${fmtDate(f.date)}</td>
      <td class="client-name">${esc(f.desc)}</td>
      <td>${catPill(f)}</td>
      <td style="text-align:right;font-weight:700;color:${type==="in"?"var(--green)":"var(--red)"}">${type==="in"?"+":"−"}${naira(amt)}</td>
      <td class="col-actions"><button class="icon-btn edit" onclick="financeForm('${f.id}')">✎</button><button class="icon-btn del" onclick="delFinance('${f.id}')">🗑</button></td>
    </tr>`;}).join("");
  view().innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n" style="color:var(--green)">${naira(inSum)}</div><div class="l">Total in</div></div>
      <div class="kpi"><div class="n" style="color:var(--red)">${naira(outSum)}</div><div class="l">Total out</div></div>
      <div class="kpi accent"><div class="n">${naira(inSum-outSum)}</div><div class="l">Balance</div></div>
    </div>
    <div class="kpis" style="margin-top:14px">
      <div class="kpi"><div class="n" style="color:var(--red)">${naira(expMonth)}</div><div class="l">Expenses this month</div></div>
      <div class="kpi"><div class="n" style="color:#7A3FF2">${naira(salMonth)}</div><div class="l">Salary this month</div></div>
    </div>
    <div class="card" style="margin-top:20px">
      <div class="pad" style="padding-bottom:6px;display:flex;justify-content:space-between;align-items:center">
        <div class="section-title"><span class="tick"></span>Ledger</div>
        <button class="btn sm ghost" onclick="lockFinance()">Lock again</button>
      </div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th><th class="col-actions"></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5" class="empty"><div class="big">No entries yet</div>Add money in or out to start the ledger.</td></tr>`}</tbody>
      </table></div>
    </div>`;
}
window.financeForm=function(fid){
  const f=fid?state.finances.find(x=>x.id===fid):{date:todayStr(),desc:"",cat:"Income",amount:""};
  const curCat = f.cat || (f.type==="in"?"Income":"Expense");
  openModal(fid?"Edit entry":"Add entry",`
    <div class="grid2">
      <div class="field"><label>Date</label><input id="m_date" type="date" value="${esc(f.date)}"></div>
      <div class="field"><label>Category</label><select id="m_cat">${CAT_LIST.map(c=>`<option ${c===curCat?"selected":""}>${c}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>Description</label><input id="m_desc" value="${esc(f.desc)}" placeholder="e.g. Deposit — Temitope, or September salary — Victor"></div>
    <div class="field"><label>Amount (₦)</label><input id="m_amount" type="number" value="${esc(f.amount)}" placeholder="0"></div>
  `, async ()=>{
    const desc=document.getElementById("m_desc").value.trim(); const amount=Number(document.getElementById("m_amount").value);
    if(!desc||!amount){alert("Description and amount are needed.");return;}
    const cat=document.getElementById("m_cat").value;
    const data={date:document.getElementById("m_date").value,cat,type:catType(cat),desc,amount};
    if(fid)Object.assign(f,data);else state.finances.push(Object.assign({id:id()},data));
    log(`Finance: ${cat} ${naira(amount)} — ${desc}`);
    await save(); closeModal(); renderFinances();
  });
};
window.delFinance=function(fid){ confirmModal("Delete this entry?", async ()=>{ state.finances=state.finances.filter(x=>x.id!==fid); await save(); closeModal(); renderFinances(); }); };

/* ---------- Personal Workspace ---------- */
function renderPersonal(){
  view().innerHTML=`
    <div class="card pad" style="margin-bottom:20px">
      <div class="row-between" style="margin-bottom:8px">
        <div class="section-title"><span class="tick"></span>To-dos</div>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:8px">
        <input id="todoInput" placeholder="Add something to do..." style="flex:1;padding:11px 12px;border:1.5px solid var(--line-strong);border-radius:10px;font-size:14.5px;background:#0E141E;color:var(--ink)">
        <button class="btn" onclick="addTodo()">Add</button>
      </div>
      <div id="todoList">${renderTodoList()}</div>
    </div>
    <div class="card pad">
      <div class="section-title"><span class="tick"></span>Notes</div>
      <p class="muted" style="margin:6px 0 12px">Anything you like — ideas, reminders, drafts. Saves as you type.</p>
      <textarea id="notesBox" style="width:100%;min-height:260px;border:1.5px solid var(--line-strong);border-radius:12px;padding:14px;font-size:14.5px;line-height:1.6;background:#0E141E;resize:vertical;color:var(--ink)" placeholder="Start writing...">${esc(state.notes)}</textarea>
    </div>`;
  const box=document.getElementById("notesBox");
  let tmr; box.addEventListener("input",()=>{ clearTimeout(tmr); tmr=setTimeout(async ()=>{ state.notes=box.value; await save(); },500); });
  box.addEventListener("blur",async ()=>{ clearTimeout(tmr); state.notes=box.value; await save(); });   // save the moment you tap away
  document.getElementById("todoInput").addEventListener("keydown",e=>{ if(e.key==="Enter") addTodo(); });
}
function renderTodoList(){
  if(!state.todos.length) return `<p class="muted">Nothing on the list. Add your first task above.</p>`;
  return state.todos.map(t=>`
    <div class="todo ${t.done?"done":""}">
      <input type="checkbox" ${t.done?"checked":""} onchange="toggleTodo('${t.id}')">
      <span class="t">${esc(t.text)}</span>
      <button class="icon-btn" onclick="delTodo('${t.id}')">🗑</button>
    </div>`).join("");
}
window.addTodo=async function(){ const i=document.getElementById("todoInput"); const v=i.value.trim(); if(!v)return; state.todos.push({id:id(),text:v,done:false}); i.value=""; await save(); document.getElementById("todoList").innerHTML=renderTodoList(); };
window.toggleTodo=async function(tid){ const t=state.todos.find(x=>x.id===tid); if(t){t.done=!t.done; await save(); document.getElementById("todoList").innerHTML=renderTodoList();} };
window.delTodo=async function(tid){ state.todos=state.todos.filter(x=>x.id!==tid); await save(); document.getElementById("todoList").innerHTML=renderTodoList(); };

/* ---------- Activity Log (code-locked) ---------- */
function renderActivity(){

  const rows=state.activity.map(a=>`<div style="display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)"><span style="font-size:14px">${esc(a.msg)}</span><span class="muted" style="font-size:12.5px;white-space:nowrap">${fmtDateTime(a.ts)}</span></div>`).join("");
  view().innerHTML=`
    <div class="card pad">
      <div class="row-between" style="margin-bottom:6px">
        <div class="section-title"><span class="tick"></span>Everything that's happened (${state.activity.length})</div>
        <button class="btn sm ghost" onclick="lockAdmin()">Lock again</button>
      </div>
      ${rows || `<p class="muted" style="margin-top:10px">Nothing logged yet.</p>`}
    </div>`;
}

/* ---------- admin gate (one code unlocks all private pages) ---------- */
function adminGate(){
  gate("Private area","Enter the admin code to open this page.", ()=>{ adminUnlocked=true; adminStamp(); renderCurrent(); }, ADMIN_CODE);
}
function finGate(){
  gate("Finances","Enter the finance code to open this page.", ()=>{ finUnlocked=true; finStamp(); renderCurrent(); }, FINANCE_CODE);
}
function gate(title,msg,onOk,code){
  view().innerHTML=`
    <div class="gate">
      <div class="lockic">🔒</div>
      <h3>${esc(title)}</h3><p>${esc(msg)}</p>
      <input id="gateInput" type="password" placeholder="••••••" autocomplete="off">
      <p class="err" id="gateErr" style="text-align:center"></p>
      <button class="btn full" id="gateBtn">Unlock</button>
    </div>`;
  const inp=document.getElementById("gateInput");
  const attempt=()=>{ if(inp.value===code){ onOk(); } else { document.getElementById("gateErr").textContent="Wrong code."; inp.value=""; } };
  document.getElementById("gateBtn").onclick=attempt;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") attempt(); });
  inp.focus();
}

/* ---------- modal helpers ---------- */
function openModal(title,bodyHTML,onSave,saveLabel){
  document.getElementById("mTitle").textContent=title;
  document.getElementById("mBody").innerHTML=bodyHTML;
  const foot=document.getElementById("mFoot");
  foot.innerHTML="";
  const cancel=document.createElement("button"); cancel.className="btn ghost"; cancel.textContent="Cancel"; cancel.onclick=closeModal;
  const ok=document.createElement("button"); ok.className="btn"; ok.textContent=saveLabel||"Save"; ok.onclick=onSave;
  foot.appendChild(cancel); foot.appendChild(ok);
  document.getElementById("overlay").classList.add("on");
}
function confirmModal(msg,onYes){
  document.getElementById("mTitle").textContent="Please confirm";
  document.getElementById("mBody").innerHTML=`<p style="margin:0">${msg}</p>`;
  const foot=document.getElementById("mFoot"); foot.innerHTML="";
  const cancel=document.createElement("button"); cancel.className="btn ghost"; cancel.textContent="Cancel"; cancel.onclick=closeModal;
  const yes=document.createElement("button"); yes.className="btn danger"; yes.textContent="Yes, delete"; yes.onclick=onYes;
  foot.appendChild(cancel); foot.appendChild(yes);
  document.getElementById("overlay").classList.add("on");
}
function closeModal(){ document.getElementById("overlay").classList.remove("on"); }
document.getElementById("mClose").onclick=closeModal;
document.getElementById("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); });

/* ---------- boot ---------- */
function autoLogin(){
  if(authGet(EDU_LOGGED)){
    adminUnlocked = false;   // always re-lock private pages on reload — code required again
    finUnlocked   = false;
    adminClear(); finClear();
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    renderSyncTag();
    go("attendance");
  }
}
(async function(){ await initSync(); autoLogin(); })();
</script>
